<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DN AI Studio - AI Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.app{max-width:700px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.header{padding:18px 16px;border-bottom:1px solid #293557;background:#111a31;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:bold}.back{color:#cbd2ea;text-decoration:none;font-size:14px}.chat{flex:1;padding:20px 16px;overflow-y:auto}.welcome{text-align:center;color:#aeb7d7;margin:30px 0}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap}.ai .bubble{background:#111a31;border:1px solid #293557}.user .bubble{background:#7055ff}.composer{padding:12px 16px 18px;background:#080d1c;border-top:1px solid #202b49;display:flex;gap:8px}#input{flex:1;padding:14px;border-radius:12px;border:1px solid #39486d;background:#111a31;color:#fff;outline:none}#send{padding:0 18px;border:0;border-radius:12px;background:#7055ff;color:#fff;font-weight:bold}#send:disabled{opacity:.5}.note{text-align:center;color:#737d9f;font-size:11px;padding:0 16px 8px}
</style>
</head>
<body>
<div class="app"><header class="header"><div class="brand">✨ DN AI Studio</div><a class="back" href="dashboard.html">← Dashboard</a></header>
<main id="chat" class="chat"><div class="welcome"><h2>🤖 AI Chat</h2><p>Ask anything and start a conversation.</p></div></main>
<div class="note">Demo chat UI — real AI API connection will be added through a secure backend.</div>
<form class="composer" onsubmit="sendMessage(event)"><input id="input" autocomplete="off" placeholder="Type your message..."><button id="send" type="submit">Send</button></form></div>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send");
function addMessage(text,type){const row=document.createElement("div");row.className="msg "+type;const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.appendChild(bubble);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
function sendMessage(e){e.preventDefault();const text=input.value.trim();if(!text)return;addMessage(text,"user");input.value="";send.disabled=true;setTimeout(()=>{addMessage("AI connection is not configured yet. This chat page is ready for the secure AI backend connection.","ai");send.disabled=false;input.focus()},500)}
</script></body></html>
