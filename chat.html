<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DN AI Studio - AI Chat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#080d1c;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.app{
  width:100%;
  max-width:650px;
  height:90vh;
  background:#111a31;
  border:1px solid #293557;
  border-radius:22px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.header{
  padding:16px 18px;
  border-bottom:1px solid #293557;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#10182d;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.status{
  font-size:12px;
  color:#9fa9ca;
  margin-top:3px;
}

.back{
  color:#b9aaff;
  text-decoration:none;
  font-size:13px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message{
  max-width:85%;
  padding:12px 15px;
  border-radius:15px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user{
  align-self:flex-end;
  background:#7055ff;
}

.ai{
  align-self:flex-start;
  background:#202b49;
  border:1px solid #344267;
}

.typing{
  opacity:.7;
  font-style:italic;
}

.bottom{
  padding:14px;
  border-top:1px solid #293557;
  background:#10182d;
}

.form{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:12px;
  border:1px solid #39486d;
  outline:none;
  background:#0a1021;
  color:white;
  font-size:15px;
}

button{
  border:0;
  border-radius:12px;
  background:#7055ff;
  color:white;
  padding:0 20px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.hint{
  text-align:center;
  color:#687394;
  font-size:11px;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="logo">✨ DN AI Studio</div>
      <div class="status">AI Chat</div>
    </div>

    <a class="back" href="index.html">← Back</a>
  </div>

  <div id="chat" class="chat">

    <div class="message ai">
      Hello! 👋 I'm DN AI Studio AI.
      How can I help you today?
    </div>

  </div>

  <div class="bottom">

    <div class="form">

      <input
        id="messageInput"
        type="text"
        placeholder="Ask me anything..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>

    </div>

    <div class="hint">
      Powered by DN AI Studio
    </div>

  </div>

</div>

<script>

const FUNCTION_URL =
"https://xpjvjxptqqibfxvoqbmn.supabase.co/functions/v1/clever-processor";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");


function addMessage(text, type){

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}


async function sendMessage(){

  const message = input.value.trim();

  if(!message){
    return;
  }

  addMessage(message, "user");

  input.value = "";

  sendButton.disabled = true;
  sendButton.textContent = "Sending...";

  const typing = addMessage(
    "AI is thinking...",
    "ai"
  );

  typing.classList.add("typing");


  try{

    const response = await fetch(FUNCTION_URL, {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:message
      })

    });


    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      data = {
        error:text || "Invalid response from server"
      };
    }


    typing.remove();


    if(!response.ok){

      addMessage(
        "Server Error: " +
        (data.error || "Unknown error"),
        "ai"
      );

      return;
    }


    addMessage(
      data.reply || "No reply received from AI.",
      "ai"
    );


  }catch(error){

    typing.remove();

    addMessage(
      "Connection Error: " + error.message,
      "ai"
    );

    console.error(error);

  }finally{

    sendButton.disabled = false;
    sendButton.textContent = "Send";
    input.focus();

  }

}


input.addEventListener("keydown", function(event){

  if(event.key === "Enter"){

    event.preventDefault();

    sendMessage();

  }

});

</script>

</body>
  </html>
