<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DN AI Studio</title>
<style>
body{margin:0;background:#080d1c;color:white;font-family:Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:420px;width:100%;background:#111a31;border:1px solid #293557;border-radius:22px;padding:25px}
h1{text-align:center;margin:0}.sub{text-align:center;color:#aeb7d7;margin:8px 0 25px}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:#202b49;color:white;font-weight:bold}.tabs .on{background:#7055ff}
input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #39486d;background:#0a1021;color:white}
.main{width:100%;padding:14px;border:0;border-radius:10px;background:#7055ff;color:white;font-weight:bold;font-size:16px;margin-top:8px}.msg{text-align:center;margin-top:15px;line-height:1.5;color:#cbd2ea}
</style></head><body>
<div class="box"><h1>✨ DN AI Studio</h1><div class="sub">AI tools for creators</div>
<div class="tabs"><button id="l" class="on" onclick="setMode('login')">Login</button><button id="s" onclick="setMode('signup')">Sign Up</button></div>
<input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Password">
<button id="go" class="main" onclick="auth()">Login</button><div id="msg" class="msg"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://xpjvjxptqqibfxvoqbmn.supabase.co","sb_publishable_JwmReyj4LK9vREEaucotvg_h_LoaWal");
let m="login";
function setMode(x){m=x;l.classList.toggle("on",x==="login");s.classList.toggle("on",x==="signup");go.textContent=x==="login"?"Login":"Create Account";msg.textContent=""}
async function auth(){
 let email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 if(!email||!password){msg.textContent="Enter your email and password.";return}
 msg.textContent="Please wait…";
 let r=m==="signup"?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error){msg.textContent=r.error.message;return}
 msg.textContent=m==="signup"?(r.data.session?"Account created!":"Account created. Check your email to confirm, then log in."):"Login successful!";
}
</script></body></html>
